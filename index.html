 const q2=lang==='es'?`Avanzamos ${round}, pero avanzamos de más.`:`We moved forward ${round}, but went too far.`;
 $('visual').innerHTML=`<div class="panel practice">
 ${practiceLine(a,b,choices)}<div class="questionblock ${saved?'correct':''}"><strong>${lang==='es'?'1. Buscamos una decena completa.':'1. Find a complete ten.'}</strong><p>${q1} ${lang==='es'?`¿Cuántos espacios avanzamos desde ${a}?`:`How many spaces do we move forward from ${a}?`}</p>${pick('j',jumpOptions)}</div>
 <div class="questionblock ${saved?'correct':''}"><strong>${lang==='es'?'2. Regresamos lo que avanzamos de más.':'2. Go back the extra spaces.'}</strong><p>${q2} ${lang==='es'?'¿Cuántos espacios debemos regresar?':'How many spaces must we go back?'}</p>${pick('r',backOptions)}</div>
 <div class="questionblock ${saved?'correct':''}"><strong>${lang==='es'?'3. Encontramos el resultado.':'3. Find the answer.'}</strong><p>${lang==='es'?`¿A qué número llegamos al sumar ${b} a ${a}?`:`Where do we land after adding ${b} to ${a}?`}</p>${pick('z',answerOptions)}</div>
 <div class="nav"><button id="check" ${saved?'disabled':''}>${lang==='es'?'Comprobar mis respuestas':'Check my answers'}</button><button id="hint" class="secondary" ${saved?'disabled':''}>${tr('hint')}</button></div>
 <div id="hintText" class="hintbox ${showHint?'':'hide'}">${lang==='es'?`Observa: ${b} necesita ${r} para llegar a ${round}. Piensa qué pasa si avanzas esa cantidad y luego regresas ${r}.`:`Look: ${b} needs ${r} to reach ${round}. Think about moving forward and then back ${r}.`}</div></div>`;
 if(saved)$('feedback').textContent=tr('good');
 document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{choices[el.dataset.q]=Number(el.dataset.val);if(el.dataset.q==='j'){delete choices.r;delete choices.z}if(el.dataset.q==='r')delete choices.z;showHint=false;renderPractice(k);$('feedback').textContent=''});
 $('hint').onclick=()=>{$('hintText').classList.remove('hide');showHint=true};
 $('check').onclick=()=>{
 if(['j','r','z'].some(q=>choices[q]===undefined)){$('feedback').textContent=lang==='es'?'Responde las tres preguntas antes de comprobar.':'Answer all three questions before checking.';return}
 if(choices.j===round&&choices.r===r&&choices.z===end){done[k]={j:round,r,z:end};showHint=false;render(false)}
 else{$('feedback').textContent=lang==='es'?'Revisa tus respuestas. Recuerda el número al que quieres llegar y cuánto debes regresar.':'Check your answers. Think about the number you want to reach and how far to go back.';$('feedback').classList.add('wrong');errors[k]=(errors[k]||0)+1}
 };
}
function reset(){window.practiceAnswers={};idx=0;phase=0;selected=false;done={};errors={};showHint=false;finished=false;render(false)}$('next').onclick=()=>{if(idx>=examples.length){if(idx===examples.length+tasks.length-1){finished=true;render(false)}else{idx++;showHint=false;render(false)}return}if(phase<7){phase++;render(true)}else{idx++;phase=0;selected=false;render(false)}};$('prev').onclick=()=>{if(idx>=examples.length){if(idx===examples.length){idx=examples.length-1;phase=7}else idx--;showHint=false;render(false);return}if(phase>0){phase--;render(false)}else if(idx>0){idx--;phase=7;selected=true;render(false)}};$('reset').onclick=reset;changeLang('es');
</script></body></html>
